<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — KK PHARMACY Digital Pharmacy</title>
  <meta name="description" content="Sign in to your KK PHARMACY healthcare account to manage prescriptions and track orders.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body id="login-page-main" class="bg-light">

  <!-- Universal Navbar -->
  <header id="main-navbar-container"></header>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5 bg-white">
            
            <div class="text-center mb-4">
              <div class="navbar-brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="bi bi-plus-lg"></i>
              </div>
              <h2 class="h4 fw-bold text-navy mb-1">Welcome to KK PHARMACY</h2>
              <p class="text-muted small">Sign in with your email or mobile credentials</p>
            </div>

            <form id="standaloneLoginForm" novalidate>
              <div class="mb-3">
                <label class="form-label small fw-semibold">Email or Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                  <input type="email" id="loginEmailInput" class="form-control border-start-0 ps-0" placeholder="user@example.com" required value="user@example.com">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                  <input type="password" id="loginPasswordInput" class="form-control border-start-0 ps-0" placeholder="••••••••" required value="password123">
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input type="checkbox" class="form-check-input" id="rememberMeCheck" checked>
                  <label class="form-check-label small" for="rememberMeCheck">Remember me</label>
                </div>
                <a href="#" class="small text-primary text-decoration-none">Forgot Password?</a>
              </div>

              <button type="submit" class="btn btn-primary-pharmacy w-100 py-2 fs-6 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Account
              </button>

              <!-- Quick Demo Login Switcher -->
              <div class="p-3 bg-light rounded-3 mb-4 text-center">
                <div class="small fw-bold text-navy mb-2">⚡ Instant Coursework Role Switcher:</div>
                <div class="d-flex justify-content-center gap-2">
                  <button type="button" class="btn btn-sm btn-outline-primary" id="btnFillUser">
                    <i class="bi bi-person me-1"></i> User Demo
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger" id="btnFillAdmin">
                    <i class="bi bi-shield-lock me-1"></i> Admin Demo
                  </button>
                </div>
              </div>

              <div class="text-center small text-muted">
                Don't have an account yet? <a href="register.html" class="fw-bold text-primary text-decoration-none">Create an Account</a>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Universal Footer -->
  <footer id="main-footer-container"></footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Modular JavaScript Architecture -->
  <script src="../js/config.js"></script>
  <script src="../js/services/storage-service.js"></script>
  <script src="../js/api/api-client.js"></script>
  <script src="../js/api/auth-api.js"></script>
  <script src="../js/api/product-api.js"></script>
  <script src="../js/api/category-api.js"></script>
  <script src="../js/api/cart-api.js"></script>
  <script src="../js/api/order-api.js"></script>
  <script src="../js/api/user-api.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/cart-service.js"></script>
  <script src="../js/services/product-service.js"></script>
  <script src="../js/services/order-service.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/loading.js"></script>
  <!-- MediMate AI Chatbot (Google Generative AI) -->
  <script src="../js/chat/MediMate_training_data.js"></script>
  <script src="../js/pages/chat-bot.js"></script>
  <script src="../js/components/category-card.js"></script>
  <script src="../js/components/product-card.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/pages/login.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
