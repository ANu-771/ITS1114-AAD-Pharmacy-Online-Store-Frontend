<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthcare Products & Medicines Catalog — KK PHARMACY</title>
  <meta name="description" content="Browse authentic medicines, certified medical devices, and wellness supplements on KK PHARMACY Digital Pharmacy.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design System -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body id="products-page-main">

  <!-- Top Announcement Bar -->
  <div class="announcement-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <div>
        <i class="bi bi-truck me-2"></i> Free delivery on orders above <strong>Rs. 5,000</strong> across Sri Lanka
      </div>
      <div class="d-none d-md-flex align-items-center gap-4">
        <span><i class="bi bi-shield-check me-1"></i> 100% Certified Products</span>
        <span><i class="bi bi-headset me-1"></i> Helpline: <strong>+94 11 234 5678</strong></span>
      </div>
    </div>
  </div>

  <!-- Dynamic Universal Navbar -->
  <header id="main-navbar-container"></header>

  <!-- Page Header Breadcrumb -->
  <div class="bg-light py-3 border-bottom">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 small">
          <li class="breadcrumb-item"><a href="../index.html">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page" id="breadcrumbCategory">Products Catalog</li>
        </ol>
      </nav>
    </div>
  </div>

  <!-- Main Catalog Content -->
  <main class="py-5">
    <div class="container">
      <div class="row g-4">
        
        <!-- Filter Sidebar -->
        <aside class="col-12 col-lg-3">
          <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
            <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
              <h5 class="fw-bold text-navy mb-0 fs-6"><i class="bi bi-funnel me-1 text-primary"></i> Filter Products</h5>
              <button class="btn btn-sm btn-link text-decoration-none text-muted p-0" id="resetFiltersBtn">Reset</button>
            </div>

            <!-- Search in catalog -->
            <div class="mb-4">
              <label class="form-label small fw-semibold text-muted">Search Keyword</label>
              <div class="input-group">
                <input type="text" id="catalogSearchInput" class="form-control form-control-sm" placeholder="e.g. Paracetamol, BP monitor...">
                <button class="btn btn-outline-primary btn-sm" id="catalogSearchBtn"><i class="bi bi-search"></i></button>
              </div>
            </div>

            <!-- Category Filter -->
            <div class="mb-4">
              <label class="form-label small fw-semibold text-muted">Categories</label>
              <div class="d-flex flex-column gap-2" id="categoryFilterList">
                <div class="form-check">
                  <input class="form-check-input filter-category-radio" type="radio" name="categoryFilter" id="cat-all" value="all" checked>
                  <label class="form-check-label small" for="cat-all">All Categories</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input filter-category-radio" type="radio" name="categoryFilter" id="cat-medicines" value="medicines">
                  <label class="form-check-label small" for="cat-medicines">Medicines (OTC & Rx)</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input filter-category-radio" type="radio" name="categoryFilter" id="cat-equipment" value="equipment">
                  <label class="form-check-label small" for="cat-equipment">Medical Equipment</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input filter-category-radio" type="radio" name="categoryFilter" id="cat-vitamins" value="vitamins">
                  <label class="form-check-label small" for="cat-vitamins">Vitamins & Supplements</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input filter-category-radio" type="radio" name="categoryFilter" id="cat-baby-care" value="baby-care">
                  <label class="form-check-label small" for="cat-baby-care">Baby Care & Pediatrics</label>
                </div>
                <div class="form-check">
                  <input class="form-check-input filter-category-radio" type="radio" name="categoryFilter" id="cat-personal-care" value="personal-care">
                  <label class="form-check-label small" for="cat-personal-care">Personal Care</label>
                </div>
              </div>
            </div>

            <!-- Price Range Filter -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label small fw-semibold text-muted mb-0">Max Price</label>
                <span class="small fw-bold text-primary" id="priceDisplay">Rs. 20,000</span>
              </div>
              <input type="range" class="form-range" id="priceRangeInput" min="500" max="20000" step="500" value="20000">
              <div class="d-flex justify-content-between small text-muted">
                <span>Rs. 500</span>
                <span>Rs. 20,000</span>
              </div>
            </div>

            <!-- Prescription Requirement Filter -->
            <div class="mb-3">
              <label class="form-label small fw-semibold text-muted">Availability & Type</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filterInStockOnly" checked>
                <label class="form-check-label small" for="filterInStockOnly">In Stock Only</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="filterRxOnly">
                <label class="form-check-label small" for="filterRxOnly">Prescription Required (Rx)</label>
              </div>
            </div>

          </div>
        </aside>

        <!-- Product Grid Area -->
        <div class="col-12 col-lg-9">
          <!-- Top Sort Bar -->
          <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 p-3 bg-white rounded-3 shadow-sm">
            <div class="small text-muted mb-2 mb-sm-0" id="productCountLabel">
              Showing products
            </div>
            <div class="d-flex align-items-center gap-2">
              <label class="small text-muted text-nowrap mb-0">Sort By:</label>
              <select class="form-select form-select-sm" id="sortSelect" style="width: auto;">
                <option value="featured">Featured First</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="rating">Top Customer Rated</option>
              </select>
            </div>
          </div>

          <!-- Product Grid Container -->
          <div class="row g-4" id="products-catalog-grid">
            <!-- Rendered by products.js -->
          </div>

          <!-- Pagination -->
          <nav class="mt-5 d-flex justify-content-center" aria-label="Product pagination">
            <ul class="pagination">
              <li class="page-item disabled"><a class="page-link" href="#"><i class="bi bi-chevron-left"></i></a></li>
              <li class="page-item active"><a class="page-link" href="#">1</a></li>
              <li class="page-item"><a class="page-link" href="#">2</a></li>
              <li class="page-item"><a class="page-link" href="#">3</a></li>
              <li class="page-item"><a class="page-link" href="#"><i class="bi bi-chevron-right"></i></a></li>
            </ul>
          </nav>

        </div>
      </div>
    </div>
  </main>

  <!-- Universal Footer -->
  <footer id="main-footer-container"></footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Modular JavaScript Architecture -->
  <script src="../js/config.js"></script>
  <script src="../js/services/storage-service.js"></script>
  <script src="../js/api/api-client.js"></script>
  <script src="../js/api/auth-api.js"></script>
  <script src="../js/api/product-api.js"></script>
  <script src="../js/api/category-api.js"></script>
  <script src="../js/api/cart-api.js"></script>
  <script src="../js/api/order-api.js"></script>
  <script src="../js/api/user-api.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/cart-service.js"></script>
  <script src="../js/services/product-service.js"></script>
  <script src="../js/services/order-service.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/loading.js"></script>
  <!-- MediMate AI Chatbot (Google Generative AI) -->
  <script src="../js/chat/MediMate_training_data.js"></script>
  <script src="../js/pages/chat-bot.js"></script>
  <script src="../js/components/category-card.js"></script>
  <script src="../js/components/product-card.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/pages/products.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
