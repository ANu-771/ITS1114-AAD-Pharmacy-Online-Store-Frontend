<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Fulfillment Management — KK PHARMACY Admin Portal</title>
  <meta name="description" content="Manage customer healthcare orders, update dispatch statuses, and verify prescriptions.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design System & Admin Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body id="admin-orders-main">

  <div class="admin-layout">
    
    <!-- Admin Sidebar -->
    <div id="admin-sidebar-container"></div>

    <!-- Admin Main -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary d-lg-none" id="toggleSidebarBtn">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h4 class="fw-bold text-navy mb-0 fs-5">Prescription & Orders Fulfillment Queue</h4>
        </div>
      </header>

      <!-- Main Body -->
      <main class="admin-body">
        
        <!-- Filter Tabs -->
        <div class="admin-card p-3 mb-4">
          <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
            <div class="d-flex gap-2 flex-wrap" id="orderFilterTabs">
              <button class="btn btn-primary-pharmacy btn-sm order-filter-btn" data-status="ALL">All Orders</button>
              <button class="btn btn-outline-secondary btn-sm order-filter-btn" data-status="PENDING">Pending</button>
              <button class="btn btn-outline-secondary btn-sm order-filter-btn" data-status="PROCESSING">Processing</button>
              <button class="btn btn-outline-secondary btn-sm order-filter-btn" data-status="DISPATCHED">Dispatched</button>
              <button class="btn btn-outline-secondary btn-sm order-filter-btn" data-status="DELIVERED">Delivered</button>
            </div>
            <div class="small text-muted" id="ordersCountLabel">Showing orders</div>
          </div>
        </div>

        <!-- Orders Table -->
        <div class="admin-card">
          <div class="table-responsive">
            <table class="table admin-table">
              <thead>
                <tr>
                  <th>Order Reference</th>
                  <th>Patient Details</th>
                  <th>Date</th>
                  <th>Order Total</th>
                  <th>Payment</th>
                  <th>Fulfillment Status</th>
                  <th class="text-end">Update Status</th>
                </tr>
              </thead>
              <tbody id="adminOrdersTableBody">
                <!-- Rendered dynamically by admin-orders.js -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Modular JavaScript Architecture -->
  <script src="../js/config.js"></script>
  <script src="../js/services/storage-service.js"></script>
  <script src="../js/api/api-client.js"></script>
  <script src="../js/api/auth-api.js"></script>
  <script src="../js/api/product-api.js"></script>
  <script src="../js/api/category-api.js"></script>
  <script src="../js/api/cart-api.js"></script>
  <script src="../js/api/order-api.js"></script>
  <script src="../js/api/admin-api.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/cart-service.js"></script>
  <script src="../js/services/product-service.js"></script>
  <script src="../js/services/order-service.js"></script>
  <script src="../js/services/admin-service.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/loading.js"></script>
  <script src="../js/components/admin-sidebar.js"></script>
  <script src="../js/pages/admin-orders.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
