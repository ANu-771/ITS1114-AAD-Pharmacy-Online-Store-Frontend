<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories — KK PHARMACY Admin Portal</title>
  <meta name="description" content="Manage pharmacy and medical equipment taxonomies, department icons, and active visibility.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💊</text></svg>">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Custom Design System & Admin Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body id="admin-categories-main">

  <div class="admin-layout">
    
    <!-- Admin Sidebar -->
    <div id="admin-sidebar-container"></div>

    <!-- Admin Main -->
    <div class="admin-main">
      
      <!-- Topbar -->
      <header class="admin-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary d-lg-none" id="toggleSidebarBtn">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h4 class="fw-bold text-navy mb-0 fs-5">Pharmacy Categories Management</h4>
        </div>

        <div class="admin-topbar-user">
          <button class="btn btn-primary-pharmacy btn-sm" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
            <i class="bi bi-plus-lg me-1"></i> Add Category
          </button>
        </div>
      </header>

      <!-- Main Body -->
      <main class="admin-body">
        
        <!-- Categories Table -->
        <div class="admin-card">
          <div class="admin-card-header">
            <h5 class="admin-card-title"><i class="bi bi-grid me-2 text-primary"></i>Healthcare Departments & Taxonomies</h5>
            <span class="small text-muted" id="categoryCountLabel">6 Active Departments</span>
          </div>
          <div class="table-responsive">
            <table class="table admin-table">
              <thead>
                <tr>
                  <th>Department / Category</th>
                  <th>Slug Identifier</th>
                  <th>Clinical Scope</th>
                  <th>Product Count</th>
                  <th>Status</th>
                  <th class="text-end">Action</th>
                </tr>
              </thead>
              <tbody id="adminCategoriesTableBody">
                <!-- Rendered dynamically by admin-categories.js -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

    </div>
  </div>

  <!-- Add Category Modal -->
  <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg rounded-4">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold text-navy"><i class="bi bi-folder-plus me-2 text-primary"></i>Add New Healthcare Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="addCategoryForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Category Name *</label>
              <input type="text" class="form-control" id="catNameInput" placeholder="e.g. Surgical & Wound Care" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Slug Identifier *</label>
              <input type="text" class="form-control" id="catSlugInput" placeholder="e.g. surgical-care" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Bootstrap Icon Class</label>
              <input type="text" class="form-control" id="catIconInput" placeholder="bi-bandaid" value="bi-bandaid">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Clinical Description</label>
              <textarea class="form-control" id="catDescInput" rows="2" placeholder="Surgical dressings, antiseptics, bandages..."></textarea>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary-pharmacy btn-sm px-3">Save Category</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Modular JavaScript Architecture -->
  <script src="../js/config.js"></script>
  <script src="../js/services/storage-service.js"></script>
  <script src="../js/api/api-client.js"></script>
  <script src="../js/api/auth-api.js"></script>
  <script src="../js/api/product-api.js"></script>
  <script src="../js/api/category-api.js"></script>
  <script src="../js/api/cart-api.js"></script>
  <script src="../js/api/order-api.js"></script>
  <script src="../js/api/admin-api.js"></script>
  <script src="../js/services/auth-service.js"></script>
  <script src="../js/services/cart-service.js"></script>
  <script src="../js/services/product-service.js"></script>
  <script src="../js/services/order-service.js"></script>
  <script src="../js/services/admin-service.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/modal.js"></script>
  <script src="../js/components/loading.js"></script>
  <script src="../js/components/admin-sidebar.js"></script>
  <script src="../js/pages/admin-categories.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
